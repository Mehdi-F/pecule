name: budget_app
description: Pécule — suivi de compte, analyses et budget perso (MVP).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: '>=2.3.0 <3.0.0'
  path: '>=1.9.0 <2.0.0'
  file_picker: '>=10.3.0 <11.0.0'
  fl_chart: '>=0.69.0 <2.0.0'
  intl: '>=0.19.0 <1.0.0'
  syncfusion_flutter_pdf: '>=27.0.0 <40.0.0'
  http: '>=1.2.0 <2.0.0'
  dart_jsonwebtoken: '>=2.14.0 <4.0.0'
  webview_flutter: '>=4.7.0 <5.0.0'
  url_launcher: '>=6.2.0 <7.0.0'
  app_links: '>=6.0.0 <7.0.0'
  workmanager: '>=0.7.0 <1.0.0'
  flutter_local_notifications: '>=17.2.0 <20.0.0'
  permission_handler: '>=11.3.0 <13.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <7.0.0'
  flutter_launcher_icons: '>=0.14.0 <1.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

# Icône de l'app (générée en CI par `dart run flutter_launcher_icons`).
# Sources du logo : assets/icon/src (SVG + script).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
  min_sdk_android: 21
