name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer la plateforme Android
        run: |
          flutter create --project-name budget_app --org com.mehdi --platforms android .
          python3 ci/patch_manifest.py android/app/src/main/AndroidManifest.xml
          python3 ci/patch_gradle.py android/app

      - run: flutter pub get

      - name: Icône de l'app
        run: dart run flutter_launcher_icons

      - name: Analyse
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
        continue-on-error: true

      - name: Tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee build.log

      - name: Remonter les erreurs
        if: always()
        run: |
          bash ci/report.sh warning analyze.log "flutter analyze"
          if [ "${{ job.status }}" != "success" ]; then
            bash ci/report.sh error test.log "flutter test"
            bash ci/report.sh error build.log "flutter build"
          fi

      # Toutes les versions doivent porter la même signature, sinon Android refuse la mise à jour.
      - name: Vérifier la signature
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          grep -qi "SHA-256 digest: 6f5fe79bd0b6823409efc6602a14394f3836110463a8defc7c9afa85c5c0dc2d" certs.txt

      - name: Renommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk pecule-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pecule-apk
          path: pecule-${{ github.run_number }}.apk

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pécule build ${{ github.run_number }}
          body: APK générée automatiquement depuis ${{ github.sha }}.
          files: pecule-${{ github.run_number }}.apk
          make_latest: true
