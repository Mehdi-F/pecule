name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer la plateforme Android
        run: |
          flutter create --project-name budget_app --org com.mehdi --platforms android .
          sed -i 's/android:label="budget_app"/android:label="Pécule"/' android/app/src/main/AndroidManifest.xml

      # Même clé de signature à chaque build : les mises à jour s'installent par-dessus sans perdre les données.
      - name: Clé de signature stable
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Analyse
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
        continue-on-error: true

      - name: Tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee build.log

      - name: Remonter les erreurs
        if: always()
        run: |
          bash ci/report.sh warning analyze.log "flutter analyze"
          if [ "${{ job.status }}" != "success" ]; then
            bash ci/report.sh error test.log "flutter test"
            bash ci/report.sh error build.log "flutter build"
          fi

      - name: Renommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk pecule-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pecule-apk
          path: pecule-${{ github.run_number }}.apk

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pécule build ${{ github.run_number }}
          body: APK générée automatiquement depuis ${{ github.sha }}.
          files: pecule-${{ github.run_number }}.apk
          make_latest: true
